<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Camera Quick Actions</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head><body>
<main id="main">
  <div id="preview">
    <video id="video" autoplay playsinline muted></video>
    <img id="still" alt="" hidden>
    <div id="nocam" hidden>
      <p>Live camera unavailable.</p>
      <label class="bigbtn alt">📷 Take / choose photo
        <input id="file" type="file" accept="image/*" capture="environment" hidden>
      </label>
    </div>
    <button id="gear" aria-label="Settings">⚙️</button>
    <button id="filebtn" aria-label="Use photo picker">🖼️</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="actions"></div>
</main>
<section id="settings" hidden>
  <h1>Settings</h1>
  <label>Webhook URL<input id="hookUrl" type="url" placeholder="https://..." autocomplete="off"></label>
  <label>Key (optional, sent as X-Webhook-Key header)<input id="hookKey" type="password" autocomplete="off"></label>
  <p class="hint">Saved only on this device. You can also open the app with <code>?hook=https://...</code></p>
  <div class="row"><button id="save" class="bigbtn">Save</button><button id="close" class="bigbtn alt">Cancel</button></div>
</section>
<script src="app.js"></script>
</body></html>
